name: CalendarSite — Build, Check, and Deploy

# Every check below blocks the deploy: the service is restarted only after
# install, typecheck, lint, tests, and build have all succeeded.
#
# Note on failure handling: in PowerShell, setting $LASTEXITCODE does NOT make a
# step fail. Only `throw` (or an explicit `exit <non-zero>`) does. That is why
# each check throws rather than merely writing a warning, and why this file must
# never end with an unconditional `exit 0`.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-check-deploy:
    name: Install, check, build, deploy
    runs-on: self-hosted
    env:
      # The API is served from this same hostname, under a path, rather than on its own port.
      # That matters for two reasons:
      #
      #   - It is on 443, so a network permitting only 80 and 443 is satisfied. A campus or
      #     corporate network that drops traffic to other ports made every action fail while the
      #     page itself loaded.
      #   - It is same-origin, so the browser sends no preflight and never checks
      #     Access-Control-Allow-Origin. There are no CORS headers to be missing or stripped in
      #     transit, because none are needed.
      #
      # A subdomain would fix only the first: a different host is a different origin, and CORS
      # stays in play. Caddy strips the /api prefix before forwarding, so the backend still
      # serves /auth/login and friends at its root.
      #
      # This value is inlined into the bundle at build time, so it cannot be changed on the
      # running server — only by a rebuild.
      NEXT_PUBLIC_API_URL: https://couchcollective.software/api
    defaults:
      run:
        working-directory: C:\Users\ferna\Documents\CalendarSite

    steps:
      - name: Update the runner working copy
        run: |
          git pull origin main
          if ($LASTEXITCODE -ne 0) { throw "git pull failed (exit $LASTEXITCODE)" }

      - name: Install dependencies
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw "install failed (exit $LASTEXITCODE)" }

      - name: Typecheck
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed (exit $LASTEXITCODE)" }

      - name: Lint
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "lint failed (exit $LASTEXITCODE)" }

      - name: Test
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "tests failed (exit $LASTEXITCODE)" }

      - name: Build
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "build failed (exit $LASTEXITCODE)" }

      - name: Restart service
        if: github.event_name == 'push'
        run: |
          servy-cli restart --name='CalendarSite' --quiet | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "servy-cli restart failed (exit $LASTEXITCODE)" }
          Write-Host "CalendarSite restarted successfully"
