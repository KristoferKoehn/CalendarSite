name: CalendarSite — Build, Check, and Deploy

# Every check below blocks the deploy: the service is restarted only after
# install, typecheck, lint, tests, and build have all succeeded.
#
# Note on failure handling: in PowerShell, setting $LASTEXITCODE does NOT make a
# step fail. Only `throw` (or an explicit `exit <non-zero>`) does. That is why
# each check throws rather than merely writing a warning, and why this file must
# never end with an unconditional `exit 0`.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build-check-deploy:
    name: Install, check, build, deploy
    runs-on: self-hosted
    env:
      # The API is served from this same hostname, under a path, rather than on its own port.
      # That matters for two reasons:
      #
      #   - It is on 443, so a network permitting only 80 and 443 is satisfied. A campus or
      #     corporate network that drops traffic to other ports made every action fail while the
      #     page itself loaded.
      #   - It is same-origin, so the browser sends no preflight and never checks
      #     Access-Control-Allow-Origin. There are no CORS headers to be missing or stripped in
      #     transit, because none are needed.
      #
      # A subdomain would fix only the first: a different host is a different origin, and CORS
      # stays in play. Caddy strips the /api prefix before forwarding, so the backend still
      # serves /auth/login and friends at its root.
      #
      # This value is inlined into the bundle at build time, so it cannot be changed on the
      # running server — only by a rebuild.
      NEXT_PUBLIC_API_URL: https://couchcollective.software/api
    defaults:
      run:
        working-directory: C:\Users\ferna\Documents\CalendarSite

    steps:
      - name: Update the runner working copy
        run: |
          git pull origin main
          if ($LASTEXITCODE -ne 0) { throw "git pull failed (exit $LASTEXITCODE)" }
          # Clears anything a previous failed run published for diagnosis.
          Remove-Item -Force 'C:\sites\games\_ci-error.txt' -ErrorAction SilentlyContinue
          Remove-Item -Force build-output.txt -ErrorAction SilentlyContinue

      - name: Install dependencies
        run: |
          npm install
          if ($LASTEXITCODE -ne 0) { throw "install failed (exit $LASTEXITCODE)" }

      - name: Clear generated Next.js types
        run: |
          # tsconfig includes .next/types/**/*.ts, and .next/ is gitignored, so it survives
          # between runs on the self-hosted runner. After a route change those generated types
          # still describe the old routes and typecheck fails on files that no longer exist —
          # pointing at the build output rather than at anything wrong with the source.
          #
          # Removing it first is the only way to typecheck the code rather than the last build.
          # It costs the build having to regenerate types, which it does anyway.
          if (Test-Path .next) {
            Remove-Item -Recurse -Force .next
            Write-Host "removed stale .next"
          } else {
            Write-Host "no .next to remove"
          }

      - name: Typecheck
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "typecheck failed (exit $LASTEXITCODE)" }

      - name: Lint
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw "lint failed (exit $LASTEXITCODE)" }

      - name: Test
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "tests failed (exit $LASTEXITCODE)" }

      - name: Build
        run: |
          # Teed so a failure can report itself. The run logs on this self-hosted runner are only
          # readable with an authenticated GitHub client, which is no help when the build breaks and
          # all the workflow says is "exit code 1".
          npm run build 2>&1 | Tee-Object -FilePath build-output.txt
          $code = $LASTEXITCODE
          "exit=$code" | Tee-Object -FilePath build-output.txt -Append
          if ($code -ne 0) { throw "build failed (exit $code)" }

      # Temporary: publishes what a failure can say about itself, where it can be read without
      # access to the run logs. The games directory is already served publicly, so this appears at
      # /games/_ci-error.txt. Cleaned at the start of every run, and this step goes away once the
      # build is fixed.
      - name: Publish the build failure
        if: failure()
        run: |
          $report = @()
          if (Test-Path build-output.txt) { $report += Get-Content build-output.txt -Tail 60 }
          $report += ''
          $report += '--- environment ---'
          try {
            $os = Get-CimInstance Win32_OperatingSystem
            $report += ('total memory: {0:N0} MB' -f ($os.TotalVisibleMemorySize / 1024))
            $report += ('free memory:  {0:N0} MB' -f ($os.FreePhysicalMemory / 1024))
          } catch { $report += "memory unavailable: $_" }
          try {
            $report += ('disk free:    {0:N0} MB' -f ((Get-PSDrive C).Free / 1MB))
          } catch { $report += "disk unavailable: $_" }
          $report += ('cpus:         {0}' -f [Environment]::ProcessorCount)
          $report += ('node:         {0}' -f (node --version))
          # A container limit is the usual reason a build dies with no message at all.
          $report += ('container:    {0}' -f (Test-Path '/.dockerenv'))
          Set-Content -Path 'C:\sites\games\_ci-error.txt' -Value ($report -join "`n") -Encoding utf8
          Write-Host "published $($report.Count) lines to /games/_ci-error.txt"

      - name: Restart service
        if: github.event_name == 'push' && success()
        run: |
          servy-cli restart --name='CalendarSite' --quiet | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "servy-cli restart failed (exit $LASTEXITCODE)" }
          Write-Host "CalendarSite restarted successfully"
