name: Next.js Local Runner Build

on:
  push:
    branches: [ "main", "master" ] # Triggers on push to main or master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    # Tells GitHub to send this job to your local machine's runner
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Matches modern Next.js environments
          cache: 'npm'     # Speeds up local builds by caching npm modules

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Site
        run: npm run build
      
      - name: Run Server
        run: servy-cli restart --name="CalendarSite"