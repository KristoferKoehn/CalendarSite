name: Next.js Local Runner Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Deploy and restart dev server
        run: |
          cd C:\Users\ferna\Documents\CalendarSite

          git pull origin main
          if ($LASTEXITCODE -ne 0) { Write-Warning "git pull failed" }
          #test
          npm install
          if ($LASTEXITCODE -ne 0) { Write-Error "npm install failed"; exit 1 }

          servy-cli restart --name='CalendarSite' --quiet

          $status = servy-cli status --name='CalendarSite' --quiet
          if ($status -notmatch "Running") {
            Write-Error "Dev server failed to start. Status: $status"
            exit 1
          }

          Write-Host "Dev server restarted successfully"