name: Next.js Local Runner Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: self-hosted
    env:
      NEXT_PUBLIC_API_URL: http://couchcollective.software:4000

    steps:
      - name: Deploy and restart dev server
        run: | 
          cd C:\Users\ferna\Documents\CalendarSite

          git pull origin main
          if ($LASTEXITCODE -ne 0) { Write-Warning "git pull failed" }

          npm install
          npm run build
          if ($LASTEXITCODE -ne 0) { Write-Error "npm install failed"; exit 1 }

          servy-cli restart --name='CalendarSite' --quiet | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Warning "servy-cli restart returned $LASTEXITCODE" }

          Write-Host "Dev server restarted successfully"
          exit 0
          